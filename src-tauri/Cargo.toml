[package]
name = "ai-interviewer"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hound = "3.5"
cpal = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "audio-spike"
path = "src/bin/audio_spike.rs"

[lib]
name = "ai_interviewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]
