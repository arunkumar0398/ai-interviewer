[package]
name = "ai-interviewer"
version = "0.1.0"
edition = "2021"
default-run = "ai-interviewer"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
anyhow = "1"
hound = "3.5"
cpal = "0.15"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "audio-spike"
path = "src/bin/audio_spike.rs"
required-features = ["spike"]

[features]
spike = []

[lib]
name = "ai_interviewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dev-dependencies]
tempfile = "3"
