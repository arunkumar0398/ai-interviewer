name: Windows Offline Package

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Build & Package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Fetch tool binaries
        run: |
          pwsh scripts/fetch-tools.ps1 -ManifestPath resources/tool-manifest.json -OutputDir .

      - name: Verify tool binaries
        run: |
          pwsh scripts/verify-tools.ps1 -ManifestPath resources/tool-manifest.json -ToolsDir tools

      - name: Build Tauri app
        run: npx tauri build

      - name: Create portable ZIP
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $zipName = "ai-interviewer-$version-windows-x64-portable.zip"
          Compress-Archive -Path out, tools, src-tauri/target/release/bundle -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload portable ZIP
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PORTABLE_ZIP }}

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: ${{ env.PORTABLE_ZIP }}
          retention-days: 7
