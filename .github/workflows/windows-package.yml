name: Windows Offline Package

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Portable Package
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Fetch tool binaries
        run: |
          pwsh scripts/fetch-tools.ps1 -ManifestPath resources/tool-manifest.json -ToolsDir tools

      - name: Verify tool binaries
        run: |
          pwsh scripts/verify-tools.ps1 -ManifestPath resources/tool-manifest.json -ToolsDir tools

      - name: Build Tauri app
        run: npx tauri build

      - name: Create portable package
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $zipName = "ai-interviewer-$version-windows-x64-portable.zip"
          New-Item -ItemType Directory -Path "portable" -Force | Out-Null
          Copy-Item -Path "out" -Destination "portable/out" -Recurse
          Copy-Item -Path "tools" -Destination "portable/tools" -Recurse
          Copy-Item -Path "src-tauri/target/release/ai-interviewer.exe" -Destination "portable/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "portable/*" -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: ${{ env.PORTABLE_ZIP }}
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-interviewer-*.zip
